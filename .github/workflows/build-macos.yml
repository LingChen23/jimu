name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [feature/cloud-diagnostics]
    paths:
      - .github/workflows/build-macos.yml
      - deploy/pc/build-macos.py
      - vue_backend/desktop_entry.py
      - vue_backend/desktop_runtime.py

permissions:
  contents: read

jobs:
  package:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vue_frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: vue_backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r vue_backend/requirements.txt 'pyinstaller>=6.16,<7'
          npm ci --prefix vue_frontend
      - name: Check desktop startup helpers
        run: python -m unittest discover -s vue_backend/tests -p test_desktop_runtime.py
      - name: Build app and DMG
        env:
          JIMU_UPLOAD_TOKEN: ${{ secrets.JIMU_UPLOAD_TOKEN }}
          JIMU_CLOUD_URL: http://39.102.212.53
        run: python deploy/pc/build-macos.py --output dist-macos
      - uses: actions/upload-artifact@v4
        with:
          name: JimuMotion-Mac-${{ matrix.arch }}
          path: |
            dist-macos/*.dmg
            dist-macos/*.app.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
