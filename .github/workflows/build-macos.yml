name: Build macOS app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vue_frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: vue_backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r vue_backend/requirements.txt 'pyinstaller>=6.16,<7' cryptography
          npm ci --prefix vue_frontend
      - name: Check desktop startup helpers
        run: python -m unittest discover -s vue_backend/tests -p test_desktop_runtime.py
      - name: Build app and DMG
        env:
          JIMU_UPLOAD_TOKEN: ${{ secrets.JIMU_UPLOAD_TOKEN }}
          JIMU_CLOUD_URL: http://39.102.212.53
        run: python deploy/pc/build-macos.py --output dist-macos
      - name: Encrypt packages before artifact upload
        env:
          JIMU_ARTIFACT_KEY: ${{ secrets.JIMU_ARTIFACT_KEY }}
        run: |
          python - <<'PY'
          import base64, io, os, tarfile
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          key = base64.b64decode(os.environ['JIMU_ARTIFACT_KEY'], validate=True)
          payload = io.BytesIO()
          with tarfile.open(fileobj=payload, mode='w') as archive:
              for path in sorted(Path('dist-macos').glob('*')):
                  archive.add(path, arcname=path.name)
          nonce = os.urandom(12)
          Path('mac-packages.enc').write_bytes(nonce + AESGCM(key).encrypt(
              nonce, payload.getvalue(), b'JimuMotion-macos-v1'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: JimuMotion-Mac-${{ matrix.arch }}
          path: mac-packages.enc
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
