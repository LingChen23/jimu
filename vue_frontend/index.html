<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="积木运动数据采集与评分系统真实设备版" />
    <title>积木运动数据采集与评分系统</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // This runs even when the main module cannot load (for example, a bad JS MIME type).
      if (location.hostname === '127.0.0.1' || location.hostname === 'localhost') {
        window.addEventListener('error', function (event) {
          if (!(event.target instanceof HTMLScriptElement)) return;
          fetch('/api/diagnostics/event', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: 'page_render_failed', operation: 'browser_page' }),
            keepalive: true
          }).catch(function () {});
        }, true);
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
